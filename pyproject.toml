[project]
name = "eduspace"
version = "1.0.0"
description = "EduSpace — an AI-powered personalized learning platform (FastAPI backend, Gemini + Groq)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "requests>=2.31",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "email-validator>=2.1",
  "cryptography>=42.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "api*"]
